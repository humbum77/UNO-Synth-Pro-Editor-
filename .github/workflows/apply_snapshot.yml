name: Apply FIX2 snapshot

on:
  push:
    branches: [main]
    paths:
      - '.snapshot_chunks/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .snapshot_chunks/part* > /tmp/snapshot.b64
          base64 -d /tmp/snapshot.b64 > /tmp/snapshot.zip
          rm -rf /tmp/snapshot
          mkdir -p /tmp/snapshot
          unzip -q /tmp/snapshot.zip -d /tmp/snapshot
          src="/tmp/snapshot/UNO_Pro_Advanced_v1.64_FIX2"
          test -f "$src/app.py"
          cp -a "$src"/. .
          rm -rf .snapshot_chunks
          rm -f SYNC_NOTE.txt
          rm -f .github/workflows/apply_snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync full v1.64 FIX2 snapshot [snapshot-sync]"
          git push
